<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open Link in Same Window</title>
</head>
<body>
<h2>Enter URL to Open</h2>
<input type="text" id="linkInput" placeholder="Enter full URL (including https://)" style="width: 80%;" />
<button onclick="openInSameWindow()">Open in Same Window</button>

<script>
function openInSameWindow() {
  const url = document.getElementById('linkInput').value.trim();
  if (url) {
    // Make sure URL starts with http:// or https://
    const hasProtocol = url.startsWith('http://') || url.startsWith('https://');
    const targetUrl = hasProtocol ? url : 'https://' + url;
    window.location.href = targetUrl; // Opens in the same window
  } else {
    alert('Please enter a URL.');
  }
}
</script>
</body>
</html>
