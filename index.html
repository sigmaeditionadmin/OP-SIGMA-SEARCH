<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sigma Search</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(ellipse at bottom, #000013 0%, #000000 100%);
    overflow: hidden;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* Stars background effect */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }

  /* Fixed search bar at the top, centered horizontally */
  .search-container {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
    overflow: hidden;
    z-index: 1;
  }

  input[type="text"] {
    padding: 10px 15px;
    font-size: 1em;
    border: none;
    outline: none;
    border-radius: 10px 0 0 10px;
    width: 300px;
  }

  button {
    padding: 10px 20px;
    font-size: 1em;
    border: none;
    outline: none;
    background-color: #fff;
    cursor: pointer;
    border-radius: 0 10px 10px 0;
  }

  /* Iframe fills remaining space below the search bar */
  .iframe-container {
    position: fixed;
    top: 50px; /* just below the search bar */
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    height: calc(100% - 60px); /* fill rest of the space */
    border: 2px solid #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

<!-- Website name -->
<h1 style="position:fixed; top:5px; width:100%; text-align:center; color:white; margin:0; font-family:sans-serif;">Sigma Search</h1>

<!-- Stars background -->
<div class="stars" id="stars"></div>

<!-- Fixed search bar at the top -->
<div class="search-container">
  <input type="text" id="urlInput" placeholder="Enter URL (with or without https://)" />
  <button onclick="loadIframe()">Go</button>
</div>

<!-- Iframe container filling space below the search bar -->
<div class="iframe-container" id="iframeContainer" style="display:none;">
  <iframe id="contentFrame" src=""></iframe>
</div>

<script>
  // Generate stars
  const starCount = 200;
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < starCount; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.width = (Math.random() * 2 + 0.5) + 'px';
    star.style.height = star.style.width;
    starsContainer.appendChild(star);
  }

  // Load URL into iframe
  function loadIframe() {
    const input = document.getElementById('urlInput').value.trim();
    if (!input) {
      alert('Please enter a URL.');
      return;
    }
    let url = input;
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }
    document.getElementById('contentFrame').src = url;
    document.getElementById('iframeContainer').style.display = 'block';
  }
</script>

</body>
</html>
