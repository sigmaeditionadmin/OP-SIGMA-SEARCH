<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sigma Search</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(ellipse at bottom, #000013 0%, #000000 100%);
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  /* Stars background */
  #stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }

  /* Title at the top */
  h1 {
    text-align: center;
    color: white;
    margin-top: 10px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }

  /* Search and button container */
  #topControls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
    position: relative;
    z-index: 1;
  }

  /* Search box styling */
  #searchBox {
    display: flex;
    background: rgba(0,0,0,0.6);
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
  }
  #searchBox input {
    padding: 10px;
    font-size: 1em;
    border: none;
    outline: none;
    width: 300px;
  }
  #searchBox button {
    padding: 10px 20px;
    font-size: 1em;
    border: none;
    outline: none;
    background: #fff;
    cursor: pointer;
  }

  /* Button to open veck.io */
  #openVeckBtn {
    padding: 10px 20px;
    font-size: 1em;
    border: none;
    outline: none;
    background: #4CAF50;
    color: white;
    border-radius: 5px;
    cursor: pointer;
  }
  #openVeckBtn:hover {
    background: #45a049;
  }

  /* iframe container */
  #iframeContainer {
    position: fixed;
    top: 100px; /* below the top controls */
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    height: calc(100% - 150px);
    border: 2px solid #fff;
    border-radius: 10px;
    overflow: hidden;
    display: none; /* hidden by default */
    z-index: 0;
  }
  #contentIframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>
<h1>Sigma Search</h1>

<!-- Stars background -->
<div id="stars"></div>

<!-- Controls: Search bar and button -->
<div id="topControls">
  <div id="searchBox">
    <input type="text" id="urlInput" placeholder="Enter URL (with or without https://)" />
    <button onclick="loadIframe()">Go</button>
  </div>
  <button id="openVeckBtn" onclick="openVeck()">Open veck.io</button>
</div>

<!-- iframe container -->
<div id="iframeContainer">
  <iframe id="contentIframe" src=""></iframe>
</div>

<script>
  // Generate stars
  const starContainer = document.getElementById('stars');
  for(let i=0; i<200; i++) {
    const star = document.createElement('div');
    star.className='star';
    star.style.top=Math.random()*100+'%';
    star.style.left=Math.random()*100+'%';
    star.style.width=(Math.random()*2+0.5)+'px';
    star.style.height=star.style.width;
    starContainer.appendChild(star);
  }

  function loadIframe() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) {
      alert('Please enter a URL');
      return;
    }
    const fullUrl = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    const iframe = document.getElementById('contentIframe');
    iframe.src = fullUrl;
    document.getElementById('iframeContainer').style.display = 'block';
  }

  function openVeck() {
    const iframe = document.getElementById('contentIframe');
    iframe.src = 'https://veck.io';
    document.getElementById('iframeContainer').style.display = 'block';
  }
</script>
</body>
</html>
