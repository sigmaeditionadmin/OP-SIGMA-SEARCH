<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sigma Search</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(ellipse at bottom, #000013 0%, #000000 100%);
    overflow: hidden;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  /* Stars background */
  #stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }
  /* Search bar styling */
  #searchContainer {
    position: fixed;
    top: 10px;
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 1;
  }
  #searchBox {
    display: flex;
    background: rgba(0,0,0,0.6);
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
    overflow: hidden;
  }
  #searchBox input {
    padding: 10px;
    font-size: 1em;
    border: none;
    outline: none;
    width: 300px;
  }
  #searchBox button {
    padding: 10px 20px;
    font-size: 1em;
    border: none;
    outline: none;
    background: #fff;
    cursor: pointer;
  }
  /* iframe container */
  #iframeContainer {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    height: calc(100% - 60px);
    border: 2px solid #fff;
    border-radius: 10px;
    overflow: hidden;
    display: none;
  }
  #contentIframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>
<h1 style="text-align:center; color:white;">Sigma Search</h1>
<!-- Stars background -->
<div id="stars"></div>
<!-- Search bar -->
<div id="searchContainer">
  <div id="searchBox">
    <input type="text" id="urlInput" placeholder="Enter URL (with or without https://)" />
    <button onclick="loadIframe()">Go</button>
  </div>
</div>
<!-- iframe display -->
<div id="iframeContainer">
  <iframe id="contentIframe" src=""></iframe>
</div>
<script>
  // Generate stars
  const starContainer = document.getElementById('stars');
  for(let i=0; i<200; i++) {
    const star = document.createElement('div');
    star.className='star';
    star.style.top=Math.random()*100+'%';
    star.style.left=Math.random()*100+'%';
    star.style.width=(Math.random()*2+0.5)+'px';
    star.style.height=star.style.width;
    starContainer.appendChild(star);
  }
  function loadIframe() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) {
      alert('Please enter a URL');
      return;
    }
    const fullUrl = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    document.getElementById('contentIframe').src = fullUrl;
    document.getElementById('iframeContainer').style.display = 'block';
  }
</script>
</body>
</html>
