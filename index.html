<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Starry Background with Iframe</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(ellipse at bottom, #000013 0%, #000000 100%);
    overflow: hidden;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: start;
    padding: 20px;
  }

  /* Stars background effect */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }

  /* Style for the iframe container (search bar look) */
  .iframe-container {
    margin-top: 100px;
    width: 80%;
    max-width: 800px;
    height: 400px;
    border: 2px solid #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
  }

  /* Make iframe fill the container */
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  h1 {
    color: white;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<h1>Starry Sky with Iframe</h1>

<!-- Stars background -->
<div class="stars" id="stars"></div>

<!-- Iframe acting as a search bar or content area -->
<div class="iframe-container">
  <!-- Example: embed a search page or YouTube, change src as needed -->
  <iframe src="https://www.youtube.com" title="YouTube"></iframe>
</div>

<script>
  // Generate random stars
  const starCount = 200; // number of stars
  const starsContainer = document.getElementById('stars');

  for (let i = 0; i < starCount; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.width = (Math.random() * 2 + 0.5) + 'px';
    star.style.height = star.style.width;
    starsContainer.appendChild(star);
  }
</script>

</body>
</html>
