<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Access YouTube</title>
</head>
<body>

<h1>Access YouTube</h1>

<!-- Button to open YouTube directly -->
<button onclick="window.open('https://www.youtube.com/watch?v=VIDEO_ID', '_blank')">
  Open YouTube in new tab
</button>

<!-- Attempt to embed YouTube in iframe -->
<h2>Embed YouTube Video</h2>
<iframe width="560" height="315" src="https://www.youtube.com/embed/VIDEO_ID" frameborder="0" allowfullscreen></iframe>

<script>
// Replace VIDEO_ID with the actual YouTube video ID you want to embed
</script>

</body>
</html>
