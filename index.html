<title>Main Page</title>
<style>

  }
  button {
    position: fixed;
    top: 10px;
    right: 10px;
    padding: 10px 20px;
    font-size: 16px;
    z-index: 999;
  }
  /* Stars background for main page (not critical here) */
  #stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at bottom, #000013 0%, #000000 100%);
    z-index: -1;
  }
</style>
</head>
<body>

<button onclick="openSigma()">Open Sigma in new tab</button>
<div id="stars"></div>

<script>
  // Generate stars on main page background
  const starCount = 200;
  const starsContainer = document.getElementById('stars');
  for (let i=0; i<starCount; i++) {
    const star = document.createElement('div');
    star.style.position='absolute';
    star.style.top=(Math.random()*100)+'%';
    star.style.left=(Math.random()*100)+'%';
    star.style.width=(Math.random()*2+0.5)+'px';
    star.style.height=star.style.width;
    star.style.background='white';
    star.style.borderRadius='50%';
    star.style.opacity='0.8';
    star.style.animation='twinkle 2s infinite alternate';
    starsContainer.appendChild(star);
  }

  function openSigma() {
    const newWin = window.open('about:blank', '_blank');
    if (!newWin) {
      alert('Popup blocked! Allow popups for this site.');
      return;
    }
