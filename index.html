<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Starry Background with Search and Viewer</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(ellipse at bottom, #000013 0%, #000000 100%);
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  /* Stars background effect */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }

  /* Search bar at the top */
  .search-container {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    background: rgba(0, 0, 0, 0.6);
    padding: 15px 20px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
    z-index: 1;
    width: 90%;
    max-width: 800px;
  }

  input[type="text"] {
    padding: 10px 15px;
    font-size: 1em;
    border: none;
    border-radius: 5px;
    outline: none;
    width: 70%;
  }

  button {
    padding: 10px 20px;
    margin-left: 10px;
    font-size: 1em;
    border: none;
    border-radius: 5px;
    background-color: #fff;
    cursor: pointer;
  }

  button:hover {
    background-color: #ddd;
  }

  /* Iframe container */
  .iframe-container {
    position: absolute;
    top: 70px; /* below the search bar */
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    height: calc(100% - 80px); /* fill remaining space */
    border: 2px solid #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
    margin-top: 10px;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

<!-- Stars background -->
<div class="stars" id="stars"></div>

<!-- Search bar at the top -->
<div class="search-container">
  <input type="text" id="urlInput" placeholder="Enter URL (with or without https://)" />
  <button onclick="loadIframe()">Go</button>
</div>

<!-- Iframe container -->
<div class="iframe-container" id="iframeContainer" style="display:none;">
  <iframe id="contentFrame" src=""></iframe>
</div>

<script>
  // Generate stars
  const starCount = 200;
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < starCount; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.width = (Math.random() * 2 + 0.5) + 'px';
    star.style.height = star.style.width;
    starsContainer.appendChild(star);
  }

  // Load URL into iframe
  function loadIframe() {
    const input = document.getElementById('urlInput').value.trim();
    if (!input) {
      alert('Please enter a URL.');
      return;
    }
    let url = input;
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }
    document.getElementById('contentFrame').src = url;
    document.getElementById('iframeContainer').style.display = 'block';
  }
</script>

</body>
</html>
