<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sigma Search</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(ellipse at bottom, #000013 0%, #000000 100%);
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* Stars background effect */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }

  /* Header with tabs */
  .header {
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.6);
    padding: 10px;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 2;
  }

  .tab {
    margin: 0 10px;
    padding: 8px 16px;
    background-color: #fff;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
  }

  .tab.active {
    background-color: #ddd;
  }

  /* Main content container */
  .content {
    display: flex;
    flex-direction: column;
    margin-top: 60px; /* below header */
    flex: 1;
    width: 100%;
  }

  /* Sigma Search tab styles */
  .search-tab {
    display: flex;
    justify-content: center;
    padding: 10px;
  }

  .search-box {
    display: flex;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
    overflow: hidden;
    width: 90%;
    max-width: 800px;
  }

  input[type="text"] {
    padding: 10px 15px;
    font-size: 1em;
    border: none;
    outline: none;
    border-radius: 10px 0 0 10px;
    width: 300px;
  }

  button {
    padding: 10px 20px;
    font-size: 1em;
    border: none;
    outline: none;
    background-color: #fff;
    cursor: pointer;
    border-radius: 0 10px 10px 0;
  }

  /* Iframe container for Sigma Search */
  .iframe-container {
    display: none;
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    height: calc(100% - 100px);
    border: 2px solid #fff;
    border-radius: 10px;
    overflow: hidden;
  }

  /* YouTube tab content styles */
  .youtube-tab {
    padding: 10px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* Style for embedded videos */
  iframe {
    margin: 10px;
    width: 400px;
    height: 225px;
    border: none;
    border-radius: 8px;
  }
</style>
</head>
<body>

<!-- Header with tabs -->
<div class="header">
  <div class="tab active" id="tab-search" onclick="showTab('search')">Sigma Search</div>
  <div class="tab" id="tab-youtube" onclick="showTab('youtube')">Wemmbu Videos</div>
</div>

<!-- Main content area -->
<div class="content">

  <!-- Sigma Search tab content -->
  <div id="section-search" class="search-tab">
    <div class="search-box">
      <input type="text" id="urlInput" placeholder="Enter URL (with or without https://)" />
      <button onclick="loadIframe()">Go</button>
    </div>
  </div>

  <!-- Wemmbu Videos tab content -->
  <div id="section-youtube" style="display:none;">
    <div class="youtube-tab">
      <!-- Embed Wemmbu's videos, including the Orbital Strike Cannon -->
      <iframe src="https://www.youtube.com/embed/oBZ7ydMaQis" allowfullscreen></iframe>
      <iframe src="https://www.youtube.com/embed/VIDEO_ID2" allowfullscreen></iframe>
      <iframe src="https://www.youtube.com/embed/VIDEO_ID3" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Iframe for Sigma Search -->
  <div class="iframe-container" id="iframeContainer" style="display:none;">
    <iframe id="contentFrame" src=""></iframe>
  </div>
</div>

<script>
  // Generate stars
  const starCount = 200;
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < starCount; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.width = (Math.random() * 2 + 0.5) + 'px';
    star.style.height = star.style.width;
    starsContainer.appendChild(star);
  }

  // Switch tabs
  function showTab(tabName) {
    document.getElementById('section-search').style.display = (tabName === 'search') ? 'flex' : 'none';
    document.getElementById('section-youtube').style.display = (tabName === 'youtube') ? 'block' : 'none';
    document.getElementById('iframeContainer').style.display = 'none';

    document.getElementById('tab-search').classList.toggle('active', tabName === 'search');
    document.getElementById('tab-youtube').classList.toggle('active', tabName === 'youtube');
  }

  // Load URL into iframe
  function loadIframe() {
    const input = document.getElementById('urlInput').value.trim();
    if (!input) {
      alert('Please enter a URL.');
      return;
    }
    let url = input;
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }
    document.getElementById('contentFrame').src = url;
    document.getElementById('iframeContainer').style.display = 'block';
  }
</script>

</body>
</html>
