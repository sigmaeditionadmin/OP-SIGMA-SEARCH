<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIGMA SEARCH</title>
</head>
<body>

<h1>SIGMA SEARCH</h1>

<button onclick="openYouTube()">Open YouTube (Base64)</button>

<iframe id="contentFrame" style="width:100%; height:80vh; border:none;"></iframe>

<script>
function encodeBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

function openYouTube() {
  const url = 'https://www.youtube.com';
  const base64Url = encodeBase64(url);
  // Use __cpo= with base64 string
  const proxyUrl = 'https://208.87.240.67/?__cpo=' + encodeURIComponent(base64Url);
  document.getElementById('contentFrame').src = proxyUrl;
}
</script>

</body>
</html>
