<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sigma Search</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(ellipse at bottom, #000013 0%, #000000 100%);
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  /* Stars background */
  #stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }

  /* Title at the top */
  h1 {
    text-align: center;
    color: white;
    margin-top: 10px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }

  /* Controls: Search and buttons container */
  #topControls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
    position: relative;
    z-index: 1;
  }

  /* Search box styling */
  #searchBox {
    display: flex;
    background: rgba(0,0,0,0.6);
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
  }
  #searchBox input {
    padding: 10px;
    font-size: 1em;
    border: none;
    outline: none;
    width: 300px;
  }
  #searchBox button {
    padding: 10px 20px;
    font-size: 1em;
    border: none;
    outline: none;
    background: #fff;
    cursor: pointer;
  }

  /* Additional site buttons style */
  .siteButton {
    padding: 10px 15px;
    font-size: 1em;
    border: none;
    outline: none;
    border-radius: 5px;
    cursor: pointer;
    background: #2196F3;
    color: white;
  }
  .siteButton:hover {
    background: #0b7dda;
  }

  /* Full screen button style */
  #fullScreenBtn {
    padding: 10px 15px;
    font-size: 1em;
    border: none;
    outline: none;
    border-radius: 5px;
    cursor: pointer;
    background: #f39c12;
    color: white;
  }
  #fullScreenBtn:hover {
    background: #d35400;
  }

  /* iframe container */
  #iframeContainer {
    position: fixed;
    top: 150px; /* below controls */
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    height: calc(100% - 160px);
    border: 2px solid #fff;
    border-radius: 10px;
    overflow: hidden;
    display: none; /* hidden by default */
    z-index: 0;
    transition: all 0.3s ease;
  }

  /* Styles for fullscreen mode via API */
  #iframeContainer.fullscreen-api {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border-radius: 0;
  }

  #contentIframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>
<h1>Sigma Search</h1>

<!-- Stars background -->
<div id="stars"></div>

<!-- Controls: Search, site buttons, full screen -->
<div id="topControls">
  <!-- Search bar -->
  <div id="searchBox">
    <input type="text" id="urlInput" placeholder="Enter URL (with or without https://)" />
    <button onclick="loadIframe()">Go</button>
  </div>
  <!-- Site buttons -->
  <button class="siteButton" onclick="openVeck()">veck.io</button>
  <button class="siteButton" onclick="loadSite('https://pizzaedition.win')">pizzaedition.win</button>
  <button class="siteButton" onclick="loadSite('https://ozgames.io')">ozgames.io</button>
  <!-- Full screen toggle button -->
  <button id="fullScreenBtn" onclick="toggleFullScreen()">FULL SCREEN</button>
</div>

<!-- iframe container -->
<div id="iframeContainer">
  <iframe id="contentIframe" src=""></iframe>
</div>

<script>
  // Generate stars
  const starContainer = document.getElementById('stars');
  for(let i=0; i<200; i++) {
    const star = document.createElement('div');
    star.className='star';
    star.style.top=Math.random()*100+'%';
    star.style.left=Math.random()*100+'%';
    star.style.width=(Math.random()*2+0.5)+'px';
    star.style.height=star.style.width;
    starContainer.appendChild(star);
  }

  function loadIframe() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) {
      alert('Please enter a URL');
      return;
    }
    const fullUrl = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    const iframe = document.getElementById('contentIframe');
    iframe.src = fullUrl;
    document.getElementById('iframeContainer').style.display = 'block';
    document.getElementById('iframeContainer').classList.remove('fullscreen-api');
  }

  function openVeck() {
    loadSite('https://veck.io');
  }

  function loadSite(url) {
    const iframe = document.getElementById('contentIframe');
    iframe.src = url;
    document.getElementById('iframeContainer').style.display = 'block';
    document.getElementById('iframeContainer').classList.remove('fullscreen-api');
  }

  function toggleFullScreen() {
    const container = document.getElementById('iframeContainer');
    if (!document.fullscreenElement) {
      container.classList.add('fullscreen-api');
      container.requestFullscreen().catch((err) => {
        alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
      });
    } else {
      document.exitFullscreen();
    }
  }
</script>
</body>
</html>
